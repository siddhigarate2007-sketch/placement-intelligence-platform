version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: placement-postgres
    restart: always
    environment:
      POSTGRES_USER: placement_admin
      POSTGRES_PASSWORD: placement_secret_password_2026
      POSTGRES_DB: placement_intelligence_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement_admin -d placement_intelligence_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://placement_admin:placement_secret_password_2026@postgres:5432/placement_intelligence_db
      - SECRET_KEY=midnight-glass-placement-intelligence-secret-key-2026-super-secure
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./backend/saved_models:/app/saved_models
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
